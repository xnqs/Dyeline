name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC, CUDA)
            os: ubuntu-24.04
            configure: -DDYELINE_ENABLE_CUDA=ON
            artifact: Dyeline-linux-x86_64
          - name: Windows (MSVC, CUDA)
            os: windows-2022
            configure: -DDYELINE_ENABLE_CUDA=ON
            artifact: Dyeline-windows-x64
          - name: macOS (universal, Metal)
            os: macos-14
            configure: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0'
            artifact: Dyeline-macos-universal

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and CUDA (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nvidia-cuda-toolkit

      - name: Install CUDA (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.6.3'
          method: network
          sub-packages: '["nvcc", "cudart"]'

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/Dyeline.ofx.bundle
          if-no-files-found: error
