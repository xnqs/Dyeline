name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC, CUDA, OpenCL)
            os: ubuntu-24.04
            configure: -DDYELINE_ENABLE_CUDA=ON
            artifact: Dyeline-linux-x86_64
          - name: Windows (MSVC, CUDA, OpenCL)
            os: windows-2022
            configure: -DDYELINE_ENABLE_CUDA=ON
            artifact: Dyeline-windows-x64
          - name: macOS (universal, Metal)
            os: macos-14
            configure: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0'
            artifact: Dyeline-macos-universal

    steps:
      - uses: actions/checkout@v4

      # PoCL is a CPU OpenCL driver, so the OpenCL backend test really runs on the runner.
      # SDL3, for the Look Designer, needs the X11 and Wayland headers.
      - name: Install Ninja, CUDA, PoCL and SDL's dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nvidia-cuda-toolkit \
            ocl-icd-libopencl1 pocl-opencl-icd \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev \
            libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl-dev libgl-dev libdbus-1-dev libudev-dev
          echo "DYELINE_REQUIRE_OPENCL=1" >> "$GITHUB_ENV"

      - name: Install CUDA (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.6.3'
          method: network
          sub-packages: '["nvcc", "cudart"]'

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # A real OFX host: render test looks through the built plugin in Natron, on the CPU and
      # on Dyeline's own OpenCL device (PoCL), and compare with the CPU reference.
      - name: Render in Natron (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          NATRON_VERSION: v2.5.0
        run: |
          assets=$(gh release view "$NATRON_VERSION" --repo NatronGitHub/Natron --json assets -q '.assets[].name')
          echo "$assets"
          asset=$(echo "$assets" | grep -iE 'linux.*64.*\.tar\.xz$' | grep -i 'no-installer' | head -1)
          [ -n "$asset" ] || asset=$(echo "$assets" | grep -iE 'linux.*64.*\.tar\.xz$' | head -1)
          gh release download "$NATRON_VERSION" --repo NatronGitHub/Natron --pattern "$asset" --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/natron"
          tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/natron"
          renderer=$(find "$RUNNER_TEMP/natron" -name NatronRenderer \( -type f -o -type l \) |
                     awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          echo "NatronRenderer: $renderer"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy OpenEXR
          "$RUNNER_TEMP/venv/bin/python" tests/hosts/natron/run.py --natron "$renderer" --plugin-dir build \
            --reference build/tests/dyeline_render_frame --work "$RUNNER_TEMP/natron-work"

      - name: Upload Natron renders (Linux, on failure)
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: natron-renders
          path: ${{ runner.temp }}/natron-work
          if-no-files-found: ignore

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/Dyeline.ofx.bundle
          if-no-files-found: error

      # The installers and archives (see packaging/package.py), made on every run so a
      # packaging break shows up in the PR that causes it.
      - name: Package
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} packaging/package.py --build build --out dist --require-installer

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-packages
          path: dist/*
          if-no-files-found: error

  # A tag such as v0.2.0 publishes the packages as a draft GitHub release, to check and
  # publish by hand.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-packages'
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "Dyeline $GITHUB_REF_NAME" --generate-notes
